name: Exploring variables and secrets.

on: push

env:
  CONTAINER_REGISTRY: docker.io
  DOCKER_USERNAME: Ruchitha
  IMAGE_NAME: github-action-nginx

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker build
        run: echo docker build -t $CONTAINER_REGISTRY/${{vars. DOCKER_USERNAME }}/$IMAGE_NAME:latest

      - name: docker login
        run: echo docker login --username=${{ vars. DOCKER_USERNAME }} --password=${{ secrets.DockerPassword }}

      - name: docker publish
        run: echo docker push $CONTAINER_REGISTRY/${{ vars. DOCKER_USERNAME }}/$IMAGE_NAME:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: docker run
        run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/${{ vars. DOCKER_USERNAME }}/$IMAGE_NAME:latest
