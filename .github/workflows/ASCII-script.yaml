name: Generate ASCII

on: push

jobs:
   ASCII_job:
       runs-on: ubuntu-latest
       steps:
        - name: checkout 
          uses: actions/checkout@v7

        - name: list repo files
          run: ls -ltra

        - name: Execute script
          run: |
            chmod +x .github/workflows/ascii.script.sh
            ./.github/workflows/ascii.script.sh