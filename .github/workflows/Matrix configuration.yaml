name: Matrix configuration 

on:
  push:
  workflow_dispatch:

jobs:
     deploy:
       strategy:
         fail-fast: true
         max-parallel: 2
         matrix:
           os: [ubuntu-latest, ubuntu-20.04, windows-latest ]
           images: [hello-world, alpine]
           exclude:
             - image: alpine
               os: windows-latest
           include:
             - image: amd64/alphine
               os: ubuntu-20.04
       runs-on: ${{ matrix.os}}
       steps:
        - name: Echo Docker Details
          run: docker info
        - name: Run images
          run: docker run ${{matrix.images}}

        
        

