version: '3.8'

services:
  # DATABASE SERVICE (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: employee_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ruchitha@3012
      POSTGRES_DB: employee_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACKEND SERVICE (Node.js + Express)
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: employee_backend
    environment:
      PORT: 3000
      DB_USER: postgres
      DB_PASSWORD: Ruchitha@3012
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: employee_database
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # FRONTEND SERVICE (Nginx)
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: employee_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# VOLUME for database persistence
volumes:
  postgres_data:
    driver: local
